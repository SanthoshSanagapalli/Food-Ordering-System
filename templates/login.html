<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In — Tiffin Box</title>
    <link
      rel="icon"
      href="../static/images/logo-mark.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="../static/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a href="index.html" class="brand">
          <img src="../static/images/logo-mark.svg" alt="Tiffin Box" />
          <span class="brand-name">Tiffin<em>Box</em></span>
        </a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
        </nav>
        <div class="nav-actions">
          <a href="cart.html" class="cart-link" aria-label="Cart"
            >🧺<span class="cart-count" data-cart-count>0</span></a
          >
          <button type="button" class="btn btn-secondary btn-sm theme-toggle">
            🌙 Dark
          </button>
        </div>
        <button class="nav-toggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main class="auth-wrap">
      <div class="auth-card">
        <div class="logo-row">
          <img src="../static/images/logo-mark.svg" alt="error" />
        </div>
        <h1>Welcome back</h1>
        <p class="auth-sub">
          Log in to track your tiffin and reorder favorites.
        </p>

        <form method="POST" action="{{ url_for('login') }}" data-validate>
          <div class="field">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            />
          </div>
          <div
            class="flex"
            style="
              justify-content: space-between;
              align-items: center;
              margin-bottom: 8px;
            "
          >
            <label class="checkbox-row"
              ><input type="checkbox" name="remember" /> Remember me</label
            >
            <a href="#" class="btn-ghost" style="padding: 0; font-size: 0.85rem"
              >Forgot password?</a
            >
          </div>
          <button
            type="submit"
            class="btn btn-primary btn-block"
            style="margin-top: 10px"
          >
            Log in
          </button>
        </form>

        <div class="divider-or">or</div>
        <p class="form-foot mt-0">
          New to Tiffin Box? <a href="register.html">Create an account</a>
        </p>
        <p class="form-foot">
          Running a kitchen? <a href="admin_login.html">Admin log in</a>
        </p>
      </div>
    </main>

    <script src="../static/javascript/script.js"></script>
  </body>
</html>
