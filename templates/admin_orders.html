<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders — Tiffin Box Admin</title>
    <link
      rel="icon"
      href="../static/images/logo-mark.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="../static/css/style.css" />
  </head>
  <body data-dashboard>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="brand">
          <img
            src="../static/images/logo-mark.svg"
            alt=""
            style="width: 26px; height: 32px"
          />
          <span class="brand-name">Tiffin<em>Box</em></span>
        </div>
        <nav class="admin-nav">
          <a href="{{ url_for('admin_dashboard') }}">📊 Dashboard</a>
          <a href="{{ url_for('manage_food') }}">🍲 Manage food</a>
          <a href="{{ url_for('admin_orders_page') }}" class="active"
            >🧾 Orders</a
          >
          <a href="{{ url_for('admin_logout') }}">Logout</a>
        </nav>
      </aside>

      <div class="admin-main">
        <div class="admin-topbar">
          <h1>Manage Orders</h1>
          <a href="manage_food.html" class="btn btn-primary btn-sm"
            >+ Add new dish</a
          >
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>All orders</h3>
            <span class="field-hint"> View and manage customer orders </span>
          </div>
          <table>
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody data-admin-orders-table></tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="../static/javascript/script.js"></script>
  </body>
</html>
